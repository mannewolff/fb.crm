# CI — dieselben Gates wie lokal (CLAUDE-java.md §8 Schritt 8, Issue #31).
#
# Jeder Schritt mit einer id "gate-…" fuehrt ein Kommando aus .claude/workflow.config.json aus,
# Zeichen fuer Zeichen: buildChecks nach Bereich (backend → verify, frontend → frontend) und
# mutationCommand im eigenen Job pit, damit dessen Laufzeit verify nicht aufhaelt.
# CiWorkflowTest haelt Config und Workflow deckungsgleich; alle uebrigen Schritte sind
# Vorbereitung.
#
# "on" steht in Anfuehrungszeichen: YAML 1.1 liest ein nacktes on als true.
name: CI

"on":
  push:
  pull_request:

# Die Jobs lesen nur. Ein Token mit mehr Rechten waere Angriffsflaeche ohne Nutzen.
permissions:
  contents: read

# Ein neuer Push auf denselben Branch loest den laufenden Durchgang ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Die Gates rufen "mvn" wie lokal; hier steht dahinter der Maven-Wrapper, damit CI die
      # Maven-Version aus .mvn/wrapper faehrt und nicht die des Runners.
      - name: Maven-Wrapper als mvn bereitstellen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/mvnw" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/mvn"
          chmod +x "$RUNNER_TEMP/bin/mvn"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Bereich betrieb: Die Workflow-Config muss gueltiges JSON sein. Er steht vor dem langen
      # Maven-Lauf, damit eine kaputte Config in Sekunden scheitert.
      - id: gate-betrieb-json
        run: node -e "JSON.parse(require('fs').readFileSync('.claude/workflow.config.json','utf8'))"
      # Docker ist auf dem Runner vorhanden — die Testcontainers-ITs laufen mit. Der volle Lauf
      # baut das Frontend mit (frontend-maven-plugin), das AccessRuleIT als index.html braucht.
      - id: gate-mvn-verify
        run: mvn verify

  # Begruendete Ausnahme von 100 % Mutationsabdeckung (CLAUDE-java.md §5.1, Plan #348): Auf
  # jedem push-Lauf entscheidet nicht der Exitcode von PIT, sondern die Quote aus dem Bericht —
  # gesperrt wird erst unter 80 %. mutationThreshold=100 bleibt, ein Lauf von Hand misst weiter
  # gegen 100 %. Der Job laeuft erst nach den kuerzeren Jobs: Ein Stand, der ohnehin nicht
  # hinausgeht, startet keine Liegezeit fuer Ueberlebenden-Karten (E20).
  pit:
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Maven-Wrapper als mvn bereitstellen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/mvnw" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/mvn"
          chmod +x "$RUNNER_TEMP/bin/mvn"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: gate-pit
        continue-on-error: ${{ github.event_name == 'push' }}
        run: mvn -Ppit -Dskip.frontend=true test
      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version-file: frontend/package.json
      # Liest target/pit-reports/mutations.xml und sperrt unter 80 % oder ohne vollstaendigen
      # Bericht (E17). Ohne Board und ohne Geheimnis.
      - id: mutationsquote
        if: github.event_name == 'push'
        run: node scripts/mutationsgate.mjs --nur-quote
      # Der Bericht fuer den Job mutationskarten, der allein das Board beschreibt.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: mutations-bericht
          path: target/pit-reports/mutations.xml
          if-no-files-found: error

  # Legt je Datei mit Ueberlebenden eine Karte an oder ergaenzt sie und prueft die Liegezeit.
  # Nur auf dem Pruefzweig: Die Umgebung board-schreiben ist auf ihn begrenzt (E2, E21), und
  # das Board-Token steht allein am schreibenden Schritt (E15).
  mutationskarten:
    needs: [pit]
    if: github.event_name == 'push' && github.ref_name == 'kit-pruefung'
    environment: board-schreiben
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
      - uses: actions/download-artifact@v4
        with:
          name: mutations-bericht
          path: target/pit-reports
      - id: mutationskarten
        run: node scripts/mutationsgate.mjs --karten
        env:
          TBX_TOKEN: ${{ secrets.TBX_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # engines.node — dieselbe Version wie node.version in pom.xml (CiWorkflowTest).
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhaengigkeiten installieren
        run: npm --prefix frontend ci
      - id: gate-build
        run: npm --prefix frontend run build
      - id: gate-lint
        run: npm --prefix frontend run lint
      - id: gate-test-coverage
        run: npm --prefix frontend run test:coverage
