# SonarCloud-Konfiguration fuer fb.crm.
sonar.projectKey=mannewolff_fb.crm
sonar.organization=mannewolff
sonar.host.url=https://sonarcloud.io

# --- Quellcode ---------------------------------------------------------------
# Backend: Maven-Konvention (src/main/java, src/test/java — keine Ueberschneidung, darum kein
# Inclusion-Muster). Frontend: Die Tests liegen neben dem Quellcode (*.test.ts(x)), deshalb steht
# frontend/src in beiden Listen; sonar.test.inclusions unterscheidet sie.
sonar.sources=src/main/java,frontend/src
sonar.tests=src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# --- Aus der Analyse genommen ------------------------------------------------
# Erzeugnisse und Fremdcode (node_modules, dist, coverage, target) analysiert niemand.
#
# src/main/resources/db/migration/** zusaetzlich aus einem fachlichen Grund: Eine gelaufene
# Flyway-Migration darf sich nicht mehr aendern — Flyway vergleicht die Pruefsumme der Datei mit
# der in seiner Schema-History gespeicherten und bricht jede bestehende Datenbank ab, sobald sie
# abweicht. Ein Sonar-Fund dort ist deshalb nicht behebbar, sondern nur Rauschen.
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,target/**,src/main/resources/db/migration/**

# --- Java-Analyse ------------------------------------------------------------
# Setzt kompilierte Klassen voraus — vor dem Scan `mvn verify` laufen lassen. Die
# Dependency-Jars liegen workspace-relativ, weil hier die sonar-scanner-CLI statt des
# sonar-maven-plugin laeuft; der CI-Build fuellt target/dependency per
# `dependency:copy-dependencies`. Kein `~`: der Scanner expandiert die Tilde nicht.
sonar.java.source=25
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# --- Abdeckungsberichte ------------------------------------------------------
# Backend: `mvn verify` erzeugt das JaCoCo-XML. Frontend: `npm run test:coverage` erzeugt lcov
# (v8-Provider, siehe frontend/vite.config.ts).
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Von der Abdeckung ausgenommen -------------------------------------------
# Diese Liste spiegelt die lokalen Ausschluesse: Backend die <excludes> des jacoco-maven-plugin in
# `pom.xml`, Frontend `coverage.exclude` in `frontend/vite.config.ts`. Ohne den Abgleich wertet
# Sonar jede analysierte Datei ohne Abdeckungsdaten als 0 % ab — auch die lokal bewusst
# ausgenommenen — und die Gesamtzahl faellt unter den echten lokalen Stand. Umgekehrt nimmt ein
# Eintrag, den es lokal nicht gibt, Sonar die Messung von Code, der gemessen werden soll.
# `SonarKonfigurationTest` haelt beide Richtungen gleich; wer dort etwas aendert, zieht hier nach.
#
# Backend (pom.xml, jacoco-maven-plugin <excludes>): reine main-Methode und die Adapter, die nur
# aus Aufrufen des AWS SDK bestehen und gegen den MinIO-Container als IT nachgewiesen sind.
# Frontend (frontend/vite.config.ts, coverage.exclude): Bootstrap, Routen-Wiring, Design-Tokens,
# Vitest-Setup und eine reine Typdeklaration.
sonar.coverage.exclusions=\
  src/main/java/org/mwolff/fbcrm/FbCrmApplication.java,\
  src/main/java/org/mwolff/fbcrm/config/S3Config.java,\
  src/main/java/org/mwolff/fbcrm/rechnung/infrastructure/S3DokumentSpeicher.java,\
  src/main/java/org/mwolff/fbcrm/angebot/infrastructure/S3AnlageSpeicher.java,\
  frontend/src/main.tsx,\
  frontend/src/App.tsx,\
  frontend/src/theme.ts,\
  frontend/src/test/setup.ts,\
  frontend/src/vite-env.d.ts

# --- Bewusste Ausnahmen ------------------------------------------------------
# Sechs Ausnahmen bleiben stehen, weil die Regel hier am Projekt vorbeigeht. Eine Ausnahme fuer
# einen Einzelbefund trifft genau eine Regel an genau einer Datei — kein Muster mit `*`, damit sie
# beim naechsten Fund nicht still mitdeckt. Als einzige Art darf eine Namensregel, die der
# Konvention des Projekts widerspricht, ein Muster tragen: Sie trifft keine Datei, sondern eine
# Konvention. `SonarKonfigurationTest` haelt die Liste auf genau diesen sechs Eintraegen und das
# Muster auf die beiden Namensregeln: Wer einen weiteren ergaenzt, laeuft rot und muss die
# Entscheidung dazu vorzeigen (Plan #238, A2 und A3; Entscheidung Manne, 2026-11-05).
#
# e1 — java:S4502 „Disabling CSRF protections is security-sensitive“ an SecurityConfig:
#   Der Schutz haengt nicht am CSRF-Token, sondern am Session-Cookie: SessionCookieFactory setzt
#   SameSite=Strict, und damit schickt der Browser das Cookie bei keiner fremden Herkunft mit. Die
#   Anwendung ist zustandslos (SessionCreationPolicy.STATELESS) und hat genau eine Origin, es gibt
#   also keine Sitzung im Server, an die ein Token gebunden werden koennte. Begruendung und
#   Bedingungen stehen in CLAUDE-security.md.
#
# e2 — java:S5693 „Allowing requests with excessive content length is security-sensitive“ an
#   application.yml (deckt beide Zeilen der Datei ab, max-file-size und max-request-size):
#   Fachlich verlangt sind 25 MB je Anlage (Plan #150, E8). Die Riegel des Containers liegen
#   bewusst darueber (26 MB und 27 MB), damit die Datei im Anwendungsfall ankommt und der Absender
#   die Meldung mit der Grenze am Feld `datei` liest statt eine abgebrochene Zerlegung; der
#   Kommentar an den beiden Zeilen in application.yml fuehrt das aus. Entscheidung Manne,
#   2026-10-05: Die Grenze bleibt, wie sie ist.
#
# e3 — typescript:S6754 „useState call is not destructured into value + setter pair“ im Frontend:
#   fb.crm benennt im Code durchgehend deutsch, der Setter heisst `setzeWert` statt `setWert`. Die
#   Regel findet keinen Mangel, sie verlangt nur eine englische Benennung. Entscheidung Manne,
#   2026-11-05: Die Namen bleiben deutsch.
#
# e4 — typescript:S7718 „The catch parameter should be named error_“ im Frontend:
#   Der catch-Parameter heisst nach derselben Konvention `ursache`. Auch diese Regel verlangt nur
#   eine englische Benennung. Entscheidung Manne, 2026-11-05: Die Namen bleiben deutsch.
#
# e5 und e6 — java:S6878 „Record patterns should be used“ an Personenauskunft.java und
#   ArbeitszeitMonatUseCase.java, den beiden Stellen, die ueber `Personenauswahl` verzweigen:
#   Fuer das zerlegende Record-Pattern legt javac einen Rueckfall in den `typeSwitch` an
#   (`iconst_1; ifeq`, nachgewiesen per `javap -c`), der nie genommen wird. JaCoCo zaehlt ihn als
#   Zweig; damit faellt die Zweigabdeckung des Bundles auf 0,99 und `jacoco:check` bricht an der
#   Schwelle von 100 % ab — nicht behebbar, weil der Zweig unerreichbar ist. Die Regel verlangt
#   also eine Schreibweise, die eine Pflichtpruefung des Projekts unerfuellbar macht; nach der
#   Prioritaetenordnung (Korrektheit vor Wartbarkeit) gewinnt die Abdeckung. Der switch selbst
#   bleibt stehen, nur die Zerlegung weicht einer Pattern-Variablen (Issue #480; Ursache des roten
#   `verify` nach Issue #477).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=src/main/java/org/mwolff/fbcrm/auth/web/SecurityConfig.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S5693
sonar.issue.ignore.multicriteria.e2.resourceKey=src/main/resources/application.yml
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6754
sonar.issue.ignore.multicriteria.e3.resourceKey=frontend/src/**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7718
sonar.issue.ignore.multicriteria.e4.resourceKey=frontend/src/**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=java:S6878
sonar.issue.ignore.multicriteria.e5.resourceKey=src/main/java/org/mwolff/fbcrm/arbeitszeit/application/Personenauskunft.java
sonar.issue.ignore.multicriteria.e6.ruleKey=java:S6878
sonar.issue.ignore.multicriteria.e6.resourceKey=src/main/java/org/mwolff/fbcrm/arbeitszeit/application/ArbeitszeitMonatUseCase.java
