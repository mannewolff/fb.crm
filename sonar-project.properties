# SonarCloud-Konfiguration fuer fb.crm.
sonar.projectKey=mannewolff_fb.crm
sonar.organization=mannewolff
sonar.host.url=https://sonarcloud.io

# --- Quellcode ---------------------------------------------------------------
# Backend: Maven-Konvention (src/main/java, src/test/java — keine Ueberschneidung, darum kein
# Inclusion-Muster). Frontend: Die Tests liegen neben dem Quellcode (*.test.ts(x)), deshalb steht
# frontend/src in beiden Listen; sonar.test.inclusions unterscheidet sie.
sonar.sources=src/main/java,frontend/src
sonar.tests=src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# --- Aus der Analyse genommen ------------------------------------------------
# Erzeugnisse und Fremdcode (node_modules, dist, coverage, target) analysiert niemand.
#
# src/main/resources/db/migration/** zusaetzlich aus einem fachlichen Grund: Eine gelaufene
# Flyway-Migration darf sich nicht mehr aendern — Flyway vergleicht die Pruefsumme der Datei mit
# der in seiner Schema-History gespeicherten und bricht jede bestehende Datenbank ab, sobald sie
# abweicht. Ein Sonar-Fund dort ist deshalb nicht behebbar, sondern nur Rauschen.
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,target/**,src/main/resources/db/migration/**

# --- Java-Analyse ------------------------------------------------------------
# Setzt kompilierte Klassen voraus — vor dem Scan `mvn verify` laufen lassen. Die
# Dependency-Jars liegen workspace-relativ, weil hier die sonar-scanner-CLI statt des
# sonar-maven-plugin laeuft; der CI-Build fuellt target/dependency per
# `dependency:copy-dependencies`. Kein `~`: der Scanner expandiert die Tilde nicht.
sonar.java.source=25
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# --- Abdeckungsberichte ------------------------------------------------------
# Backend: `mvn verify` erzeugt das JaCoCo-XML. Frontend: `npm run test:coverage` erzeugt lcov
# (v8-Provider, siehe frontend/vite.config.ts).
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Von der Abdeckung ausgenommen -------------------------------------------
# Diese Liste spiegelt die lokalen Ausschluesse: Backend die <excludes> des jacoco-maven-plugin in
# `pom.xml`, Frontend `coverage.exclude` in `frontend/vite.config.ts`. Ohne den Abgleich wertet
# Sonar jede analysierte Datei ohne Abdeckungsdaten als 0 % ab — auch die lokal bewusst
# ausgenommenen — und die Gesamtzahl faellt unter den echten lokalen Stand. Umgekehrt nimmt ein
# Eintrag, den es lokal nicht gibt, Sonar die Messung von Code, der gemessen werden soll.
# `SonarKonfigurationTest` haelt beide Richtungen gleich; wer dort etwas aendert, zieht hier nach.
#
# Backend (pom.xml, jacoco-maven-plugin <excludes>): reine main-Methode und die Adapter, die nur
# aus Aufrufen des AWS SDK bestehen und gegen den MinIO-Container als IT nachgewiesen sind.
# Frontend (frontend/vite.config.ts, coverage.exclude): Bootstrap, Routen-Wiring, Design-Tokens,
# Vitest-Setup und eine reine Typdeklaration.
sonar.coverage.exclusions=\
  src/main/java/org/mwolff/fbcrm/FbCrmApplication.java,\
  src/main/java/org/mwolff/fbcrm/config/S3Config.java,\
  src/main/java/org/mwolff/fbcrm/rechnung/infrastructure/S3DokumentSpeicher.java,\
  src/main/java/org/mwolff/fbcrm/angebot/infrastructure/S3AnlageSpeicher.java,\
  frontend/src/main.tsx,\
  frontend/src/App.tsx,\
  frontend/src/theme.ts,\
  frontend/src/test/setup.ts,\
  frontend/src/vite-env.d.ts
