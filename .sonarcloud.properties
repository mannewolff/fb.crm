# Flyway-Migrationen sind aus der Analyse genommen.
#
# Eine gelaufene Migration darf sich nicht mehr aendern: Flyway vergleicht ihre Pruefsumme
# und bricht jede bestehende Datenbank ab, sobald die Datei abweicht. Ein Sonar-Fund dort
# ist deshalb nicht behebbar, sondern nur Rauschen.
sonar.exclusions=src/main/resources/db/migration/**
