services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fbcrm}
      POSTGRES_USER: ${POSTGRES_USER:-fbcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fbcrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fbcrm} -d ${POSTGRES_DB:-fbcrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # quay.io statt Docker Hub: `minio/minio` existiert dort nicht mehr. Fester Tag statt
    # `latest`, damit ein Deployment nicht erneut an einer bewegten Referenz scheitert.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fbcrm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fbcrm-minio}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  fbcrm-api:
    build: .
    environment:
      FBCRM_BASE_URL: ${FBCRM_BASE_URL:-https://localhost}
      # Dies ist der lokale Entwicklungs-Stack: Der Schalter erlaubt den Start mit den
      # unsicheren Defaults unten — die Anwendung warnt dabei. Das Produktions-Overlay
      # (docker-compose.prod.yml) setzt ihn fest auf false und erbt diesen Wert nicht.
      FBCRM_DEV_MODE: ${FBCRM_DEV_MODE:-true}
      # Secret zum Signieren der Session-Tokens. Der Default unten gilt nur im
      # Entwicklungsbetrieb (FBCRM_DEV_MODE=true) — die Anwendung warnt dann beim Start.
      # In Produktion verweigert sie ihn; dort zwingend über die .env durch einen
      # zufälligen 32+-Byte-Wert ersetzen.
      FBCRM_SESSION_SECRET: ${FBCRM_SESSION_SECRET:-dev-only-insecure-secret-change-me}
      # Session-Cookie nur über HTTPS ausliefern. Hinter TLS (Prod) true; für reines HTTP-Lokal ggf. false.
      # Der Name ist der, den application.yml liest — unter FBCRM_COOKIE_SECURE kam der Wert zwar
      # im Container an, aber niemand las ihn (Issue #32).
      FBCRM_SESSION_COOKIE_SECURE: ${FBCRM_SESSION_COOKIE_SECURE:-true}
      # Peer-Adressen, deren X-Forwarded-For die Anwendung glaubt (E9), kommagetrennt. Leer heisst:
      # Es zaehlt die Adresse der Gegenstelle. Ohne Eintrag hier erreichte ein Wert aus der .env
      # den Container nicht.
      FBCRM_TRUSTED_PROXIES: ${FBCRM_TRUSTED_PROXIES:-}
      # Einmal-Token für den ersten Plattform-Admin (leer = deaktiviert; greift nur ohne Admin).
      FBCRM_BOOTSTRAP_ADMIN_TOKEN: ${FBCRM_BOOTSTRAP_ADMIN_TOKEN:-}
      FBCRM_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fbcrm}
      FBCRM_DB_USER: ${POSTGRES_USER:-fbcrm}
      FBCRM_DB_PASSWORD: ${POSTGRES_PASSWORD:-fbcrm}
      FBCRM_MAIL_ENABLED: ${FBCRM_MAIL_ENABLED:-false}
      FBCRM_MAIL_FROM: ${FBCRM_MAIL_FROM:-no-reply@fbcrm.local}
      # Zeigt auf den Auffangserver unten (Profil dev-mail). Ohne dieses Profil laeuft dort
      # nichts — was nichts ausmacht, solange FBCRM_MAIL_ENABLED auf false steht: Dann wird
      # gar nicht erst zugestellt, und die Auftraege bleiben mit attempts = 0 liegen.
      FBCRM_SMTP_HOST: ${FBCRM_SMTP_HOST:-mailpit}
      FBCRM_SMTP_PORT: ${FBCRM_SMTP_PORT:-1025}
      FBCRM_SMTP_USER: ${FBCRM_SMTP_USER:-}
      FBCRM_SMTP_PASSWORD: ${FBCRM_SMTP_PASSWORD:-}
      FBCRM_SMTP_AUTH: ${FBCRM_SMTP_AUTH:-true}
      FBCRM_SMTP_STARTTLS: ${FBCRM_SMTP_STARTTLS:-true}
      FBCRM_MINIO_ENDPOINT: http://minio:9000
      FBCRM_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-fbcrm}
      FBCRM_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fbcrm-minio}
      # Transaktionale Zustellung der Seiteneffekte (Mail, Speicher). Die Variablen haengen
      # hier, weil eine Variable, die im environment-Block fehlt, den Container gar nicht
      # erreicht — wer sie in der .env abschaltet, erzielte sonst keine Wirkung, ohne dass
      # etwas anschlaegt. Jede mit Default: @ConditionalOnProperty(havingValue = "true") liest
      # einen Leerstring als "nicht true", der Job fiele bei der Form ${NAME:-} also
      # stillschweigend weg.
      FBCRM_OUTBOX_ENABLED: ${FBCRM_OUTBOX_ENABLED:-true}
      FBCRM_OUTBOX_POLL_INTERVAL_MS: ${FBCRM_OUTBOX_POLL_INTERVAL_MS:-5000}
      FBCRM_OUTBOX_MAX_ATTEMPTS: ${FBCRM_OUTBOX_MAX_ATTEMPTS:-8}
      FBCRM_OUTBOX_RETENTION_DAYS: ${FBCRM_OUTBOX_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Gesund heisst: Spring Boot ist hochgefahren, Flyway ist durch, und /actuator/health antwortet
    # UP. curl liegt im Image allein fuer diese Zeile. start_period deckt den ersten Start mit den
    # Migrationen ab; in dieser Zeit zaehlen Fehlschlaege nicht.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Auffangserver fuer den lokalen Entwicklungsbetrieb (E8): nimmt alles an, stellt nichts zu
  # und zeigt jede Nachricht in seiner Weboberflaeche. Nur unter dem Profil dev-mail, damit der
  # normale Stack ihn nicht mitstartet:
  #
  #   docker compose --profile dev-mail up -d
  #
  # Danach FBCRM_MAIL_ENABLED=true setzen — der Default FBCRM_SMTP_HOST zeigt bereits hierher,
  # ebenso FBCRM_SMTP_PORT:-1025. Mailpit spricht ohne Anmeldung und ohne TLS; dafuer stehen
  # FBCRM_SMTP_AUTH und FBCRM_SMTP_STARTTLS in der .env auf false.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev-mail"]
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      FBCRM_DOMAIN: ${FBCRM_DOMAIN:-localhost}
      FBCRM_ACME_EMAIL: ${FBCRM_ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Erst die gesunde API, dann der Proxy: Sonst beantwortete Caddy die ersten Aufrufe mit 502.
    depends_on:
      fbcrm-api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
